<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texa</title>
    <script>
      const startupDesktop = window.kaoyanDesktop;
      document.documentElement.dataset.platform = startupDesktop?.platform || '';
      try {
        const appearance = startupDesktop?.getStartupAppearance?.();
        for (const [token, value] of Object.entries(appearance?.tokens || {})) {
          document.documentElement.style.setProperty(token, value);
        }
      } catch {
        // The default Texa accent below remains available during early startup.
      }
    </script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --color-bg-primary: #faf9f6;
        --color-bg-card: #ffffff;
        --color-text-primary: #25272d;
        --color-text-secondary: #686b74;
        --color-border: #e0dfdb;
        --color-accent: #435dc5;
        --color-accent-hover: #324ba9;
        --accent-soft: #edf0fb;
        --danger: #b42318;
        --radius-panel: 12px;
        --radius-control: 8px;
      }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--color-bg-primary);
        color: var(--color-text-primary);
        font-family: "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body.is-leaving .stage {
        animation: stage-out 220ms cubic-bezier(.35,0,.2,1) both;
      }
      .stage {
        position: relative;
        width: min(560px, calc(100vw - 40px));
        animation: stage-in 560ms cubic-bezier(.2,.82,.2,1) both;
      }
      .shell {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-panel);
        background: var(--color-bg-card);
        padding: 42px 36px 32px;
        box-shadow: 0 8px 24px rgba(35,40,37,0.08);
      }
      .content {
        position: relative;
        z-index: 1;
        text-align: center;
      }
      .brand-logo {
        display: flex;
        width: min(250px, 72vw);
        min-height: 98px;
        align-items: center;
        justify-content: center;
        margin: 0 auto 28px;
      }
      .brand-logo img {
        display: block;
        width: 100%;
        height: auto;
      }
      h1 {
        min-height: 36px;
        max-width: 430px;
        margin: 0 auto;
        font-size: clamp(20px, 4vw, 25px);
        font-weight: 760;
        line-height: 1.36;
        letter-spacing: 0;
        text-wrap: balance;
      }
      .status-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 26px;
        color: var(--color-text-secondary);
        font-size: 13px;
      }
      .pulse {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--color-accent);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent) 28%, transparent);
        animation: pulse 1.45s ease-out infinite;
      }
      .bar {
        position: relative;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(0,0,0,0.08);
        margin-top: 18px;
      }
      .bar::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--color-accent), transparent);
        animation: load 1.2s cubic-bezier(.45,0,.2,1) infinite;
      }
      .details {
        display: none;
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid rgba(180,35,24,0.18);
        border-radius: var(--radius-control);
        background: rgba(255,255,255,0.62);
        color: #7a271a;
        font-size: 13px;
        line-height: 1.55;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .actions {
        display: none;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      button {
        min-height: 36px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-control);
        background: var(--color-bg-card);
        color: var(--color-text-primary);
        cursor: pointer;
        font: inherit;
        padding: 8px 14px;
        transition: border-color 160ms ease, background-color 160ms ease;
      }
      button:hover { border-color: var(--color-accent); background: var(--accent-soft); }
      button:active { background: var(--accent-soft); }
      button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
      button.primary { border-color: var(--color-accent); background: var(--color-accent); color: #fff; }
      button.primary:hover, button.primary:active { background: var(--color-accent-hover); }
      button:disabled { cursor: wait; opacity: 0.62; }
      .error .pulse { background: var(--danger); animation: none; box-shadow: none; }
      .error .bar::before { animation: none; width: 100%; background: var(--danger); }
      .error .details { display: block; }
      .error .actions { display: flex; }
      @keyframes stage-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes stage-out {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-8px); }
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-accent) 28%, transparent); }
        70% { box-shadow: 0 0 0 12px transparent; }
        100% { box-shadow: 0 0 0 0 transparent; }
      }
      @keyframes load {
        from { transform: translateX(-110%); }
        to { transform: translateX(240%); }
      }
      .loading-window-dragbar {
        position: fixed;
        inset: 0 0 auto;
        z-index: 10000;
        height: 64px;
        app-region: drag;
        -webkit-app-region: drag;
      }
      .loading-window-controls {
        position: fixed;
        inset: 0 0 auto auto;
        z-index: 10001;
        display: none;
        app-region: no-drag;
        -webkit-app-region: no-drag;
      }
      html[data-platform="win32"] .loading-window-controls,
      html[data-platform="linux"] .loading-window-controls { display: flex; }
      .loading-window-button {
        display: grid;
        width: 46px;
        height: 40px;
        place-items: center;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #4b4d50;
        padding: 0;
        font: 16px/1 "Segoe UI Symbol", sans-serif;
        transition: background-color 140ms ease, color 140ms ease, transform 120ms ease;
      }
      .loading-window-button:hover { border-color: transparent; background: rgba(0,0,0,0.07); }
      .loading-window-button:active { transform: scale(0.96); }
      .loading-window-close:hover { background: #c42b1c; color: #fff; }
      @media (max-width: 520px) {
        .shell { padding: 36px 24px 28px; }
        .brand-logo { width: min(230px, 76vw); margin-bottom: 24px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage, body.is-leaving .stage, .pulse, .bar::before { animation: none; }
        .loading-window-button { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="loading-window-dragbar" aria-hidden="true"></div>
    <div class="loading-window-controls" aria-label="窗口控制">
      <button class="loading-window-button" id="minimizeWindow" aria-label="最小化窗口">−</button>
      <button class="loading-window-button" id="maximizeWindow" aria-label="最大化窗口">□</button>
      <button class="loading-window-button loading-window-close" id="closeWindow" aria-label="关闭窗口">×</button>
    </div>
    <main class="stage">
      <section class="shell" id="shell">
        <div class="content">
          <div class="brand-logo" aria-hidden="true">
            <img src="./assets/texa-lockup.svg" alt="" />
          </div>
          <h1 id="greeting">正在准备 Texa</h1>
          <div class="status-row"><span class="pulse"></span><span id="statusText">初始化中</span></div>
          <div class="bar"></div>
          <div class="details" id="details"></div>
          <div class="actions" id="actions">
            <button class="primary" id="retryStartup">重新连接</button>
            <button class="primary" id="repairEmbedding">修复模型资源</button>
            <button id="openWeb">用浏览器打开 Web 端</button>
            <button id="openLog">查看后端日志</button>
          </div>
        </div>
      </section>
    </main>
    <script>
      const desktop = window.kaoyanDesktop;
      const shell = document.getElementById('shell');
      const greeting = document.getElementById('greeting');
      const statusText = document.getElementById('statusText');
      const details = document.getElementById('details');
      const actions = document.getElementById('actions');
      const retryButton = document.getElementById('retryStartup');
      const repairButton = document.getElementById('repairEmbedding');
      const maximizeButton = document.getElementById('maximizeWindow');

      document.getElementById('minimizeWindow').addEventListener('click', () => desktop?.minimize?.());
      document.getElementById('closeWindow').addEventListener('click', () => desktop?.close?.());
      document.getElementById('maximizeWindow').addEventListener('click', async () => {
        const maximized = await desktop?.toggleMaximize?.();
        maximizeButton.textContent = maximized ? '❐' : '□';
        maximizeButton.setAttribute('aria-label', maximized ? '还原窗口' : '最大化窗口');
      });
      desktop?.isMaximized?.().then((maximized) => {
        maximizeButton.textContent = maximized ? '❐' : '□';
        maximizeButton.setAttribute('aria-label', maximized ? '还原窗口' : '最大化窗口');
      });

      function showStartupError(payload) {
        const info = typeof payload === 'string' ? { message: payload } : payload || {};
        const failure = info.failure || {};
        const friendlyFailures = {
          MODEL_MISSING: '嵌入模型缺失，可以尝试修复运行资源。',
          MODEL_CORRUPT_OR_INCOMPATIBLE: '嵌入模型已损坏或版本不兼容，可以尝试修复。',
          ORT_IMPORT_FAILURE: 'ONNX Runtime 无法加载，请重新安装适用于当前系统架构的版本。',
          UNSUPPORTED_ARCHITECTURE: '当前系统架构不受支持，Texa Standard 支持 Windows x64 和 macOS arm64。',
          TOKENIZER_MISMATCH: '分词器资源与模型版本不匹配，可以尝试修复。',
          ASSET_REPAIR_FAILED: '运行资源修复失败，请检查网络后重试或查看诊断日志。',
        };
        shell.classList.add('error');
        greeting.textContent = 'Texa 启动需要处理';
        statusText.textContent = friendlyFailures[failure.code] || '本地服务暂不可用';
        details.style.display = 'block';
        actions.style.display = 'flex';
        repairButton.style.display = failure.recoverable && failure.repair_action === 'repair_embedding_runtime' ? '' : 'none';
        details.textContent = `错误代码：${failure.code || 'STARTUP_FAILURE'}\n诊断编号：${failure.diagnostic_id || '未生成'}\n日志：${info.logPath || '应用数据目录\\logs\\backend.log'}`;
      }

      retryButton.addEventListener('click', async () => {
        shell.classList.remove('error');
        greeting.textContent = '正在重新连接本地服务';
        statusText.textContent = '等待后端就绪';
        details.style.display = 'none';
        actions.style.display = 'none';
        retryButton.disabled = true;
        try {
          const result = await desktop?.retryStartup?.();
          if (result && !result.ready) showStartupError(result);
        } catch (error) {
          showStartupError({ message: error?.message || String(error) });
        } finally {
          retryButton.disabled = false;
        }
      });
      document.getElementById('openWeb').addEventListener('click', () => desktop?.openWebFallback?.());
      document.getElementById('openLog').addEventListener('click', () => desktop?.openBackendLog?.());
      desktop?.onStartupError?.(showStartupError);
      desktop?.onBackendStatus?.((state) => {
        if (!state || state.status === 'failed') return;
        shell.classList.remove('error');
        greeting.textContent = '正在准备 Texa';
        statusText.textContent = state.message || '正在初始化本地学习环境';
        details.style.display = 'none';
        actions.style.display = 'none';
      });
      repairButton.addEventListener('click', async () => {
        shell.classList.remove('error');
        greeting.textContent = '正在修复 Texa';
        statusText.textContent = '正在校验并安装模型资源';
        details.style.display = 'none';
        actions.style.display = 'none';
        repairButton.disabled = true;
        try {
          const result = await desktop?.repairEmbeddingRuntime?.();
          if (result && !result.ready) showStartupError(result);
        } catch (error) {
          showStartupError({ message: error?.message || String(error), failure: { code: 'ASSET_REPAIR_FAILED' } });
        } finally {
          repairButton.disabled = false;
        }
      });
      desktop?.getStartupInfo?.().then((info) => {
        if (info?.message) showStartupError(info);
      });
    </script>
  </body>
</html>
