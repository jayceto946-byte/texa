name: Publish approved Texa test prerelease

on:
  push:
    branches: [Texa_MacOS]
    paths: [.github/workflows/publish-texa-test-prerelease.yml]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish the approved release
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/418385826" > release-before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('release-before.json').read_text())
          assert release['name'] == release['tag_name'] == 'V0.9_pre_release'
          assert release['target_commitish'] == '24973dbc4a12695019ba8a8ed0142c3aa765cd0a'
          asset = next(a for a in release['assets'] if a['name'] == 'texa_test.exe')
          assert asset['state'] == 'uploaded' and asset['size'] == 241547307
          assert asset['digest'] == 'sha256:ec0a83f69429a5bef7e2e054e572488eea5b4084d6405601997dabce1c2eb15b'
          Path('publish-request.json').write_text(json.dumps(dict(draft=False, prerelease=True, make_latest='false')))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/418385826" --input publish-request.json > release-published.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('release-published.json').read_text())
          assert not release['draft'] and release['prerelease'] and release['published_at']
          assert release['tag_name'] == 'V0.9_pre_release'
          asset = next(a for a in release['assets'] if a['name'] == 'texa_test.exe')
          assert asset['digest'] == 'sha256:ec0a83f69429a5bef7e2e054e572488eea5b4084d6405601997dabce1c2eb15b'
          print(json.dumps(dict(url=release['html_url'], published_at=release['published_at'], download=asset['browser_download_url'], prerelease=release['prerelease'])))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: texa-test-prerelease-publication-receipt
          path: release-published.json
          retention-days: 14
