name: Windows v0.9.1 inspection installer
# Source checkout paths are canonicalized on Windows before update validation.

on:
  workflow_dispatch:
  push:
    branches: [Texa_MacOS]
    paths: [.github/workflows/windows-inspection-installer.yml]

permissions:
  contents: write

concurrency:
  group: windows-v0.9.1-installer
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install locked build dependencies
        run: |
          python -m venv venv310
          .\venv310\Scripts\python.exe -m pip install -r requirements-build.txt pytest==9.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
          .\venv310\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Bind installer to its source commit
        run: node scripts/prepare-commit-update.cjs prepare
      - name: Verify source and UI contracts
        run: |
          .\venv310\Scripts\python.exe scripts\check_version_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          .\venv310\Scripts\python.exe -m pytest -q tests\test_session_notes.py
          if ($LASTEXITCODE -ne 0) { throw 'Notes contracts failed' }
          npm test --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run lint --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed' }
          npm test --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          npm run check --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop syntax checks failed' }
      - name: Build Windows backend and frontend
        run: .\scripts\build-desktop-backend.ps1 -Python .\venv310\Scripts\python.exe
      - name: Smoke test the native Windows backend
        run: |
          $env:TEXA_FROZEN_SMOKE = '1'
          $env:TEXA_EMBEDDING_BACKEND = 'onnx'
          $env:TEXA_EMBEDDING_ASSET_DIR = (Resolve-Path assets\embedding-runtime\bge-small-zh-v1.5\onnx-fp32-v1).Path
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP 'texa-test-smoke\data'
          $env:PROGRESS_PATH = Join-Path $env:RUNNER_TEMP 'texa-test-smoke\progress'
          $process = Start-Process build\backend\backend_server\backend_server.exe -NoNewWindow -PassThru -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-error.log
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'Frozen backend smoke timed out'
          }
          Get-Content smoke-out.log
          Get-Content smoke-error.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path smoke-out.log -SimpleMatch TEXA_FROZEN_SMOKE_PASS)) { throw 'Frozen backend smoke failed' }
      - name: Package NSIS installer texa_test_v0.9.1.exe
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win nsis --x64 --publish never --config.artifactName=texa_test_v0.9.1.exe
      - name: Bind update manifest
        run: node scripts/prepare-commit-update.cjs annotate
      - name: Record package identity
        run: |
          $exe = Get-Item release\texa_test_v0.9.1.exe
          if ($exe.Length -lt 100MB) { throw 'Unexpectedly small desktop package' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Output is not a Windows executable' }
          $identity = @{
            commit = $env:GITHUB_SHA
            branch = $env:GITHUB_REF_NAME
            artifact = 'texa_test_v0.9.1.exe'
            sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            bytes = $exe.Length
            target = 'Windows x64 NSIS installer'
            version = (Get-Content desktop\package.json -Raw | ConvertFrom-Json).version
            update_channel = 'commit'
            signed = $false
            backend_smoke = 'TEXA_FROZEN_SMOKE_PASS'
            ui_manual_acceptance = 'pending on Windows'
          }
          $identity | ConvertTo-Json | Set-Content release\texa_test_v0.9.1-build.json -Encoding utf8
          $identity | ConvertTo-Json
      - uses: actions/upload-artifact@v4
        with:
          name: texa_test_v0.9.1-windows-x64
          path: |
            release/texa_test_v0.9.1.exe
            release/texa_test_v0.9.1.exe.blockmap
            release/texa_test_v0.9.1-build.json
            release/commit.yml
          if-no-files-found: error
          retention-days: 14
      - name: Upload installer to the requested draft v0.9.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $identity = Get-Content release\texa_test_v0.9.1-build.json -Raw | ConvertFrom-Json
          $body = @"
          Windows x64 NSIS 检查安装包：texa_test_v0.9.1.exe（未签名）。

          检查批次：v0.9.1；程序内部版本：$($identity.version)。内部版本按 commit 排序，避免与现有 1.0.0 安装版发生错误降级。
          源码提交：$env:GITHUB_SHA。
          SHA-256：$($identity.sha256)。

          包含按提交更新的设置入口。commit 通道尚需后续签名构建与启用；本草稿不作为正式更新源。
          后端笔记合同、前端/桌面自动测试、冻结后端 smoke 通过；Windows 原生安装与 UI 人工验收待完成。
          "@
          $body | Set-Content release\v0.9.1-notes.md -Encoding utf8
          gh release view v0.9.1 --json isDraft,targetCommitish --jq '.' 2>$null | Set-Content existing-release.json
          if ($LASTEXITCODE -eq 0) {
            $existing = Get-Content existing-release.json -Raw | ConvertFrom-Json
            if (-not $existing.isDraft -or $existing.targetCommitish -ne $env:GITHUB_SHA) { throw 'Existing v0.9.1 does not match this draft build; preserving it' }
          } else {
            gh release create v0.9.1 --target $env:GITHUB_SHA --title v0.9.1 --draft --prerelease --latest=false --notes-file release\v0.9.1-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          }
          gh release upload v0.9.1 release\texa_test_v0.9.1.exe release\texa_test_v0.9.1-build.json release\texa_test_v0.9.1.exe.blockmap release\commit.yml
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload failed; existing assets preserved' }
          gh release view v0.9.1 --json url,isDraft,tagName,assets | Set-Content release\v0.9.1-upload.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texa_test_v0.9.1-build-diagnostics
          path: |
            release/v0.9.1-upload.json
            smoke-out.log
            smoke-error.log
            release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 14
