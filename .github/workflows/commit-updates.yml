name: Texa commit updates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Windows commit update
        type: boolean
        default: false
  push:
    branches: [Texa_MacOS]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: texa-commit-updates
  cancel-in-progress: true

jobs:
  baseline:
    if: github.ref == 'refs/heads/Texa_MacOS'
    runs-on: ubuntu-latest
    permissions:
      # GitHub draft releases require push permission even for downloads.
      contents: write
    steps:
      - name: Fetch pinned inspection installer from the existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v0.9.1 --pattern texa_test_v0.9.1.exe --dir baseline
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-baseline
          path: baseline/texa_test_v0.9.1.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build:
    needs: baseline
    if: github.ref == 'refs/heads/Texa_MacOS'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    outputs:
      version: ${{ steps.identity.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact commit bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-release.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install locked CI dependencies
        run: |
          python -m venv venv310
          .\venv310\Scripts\python.exe -m pip install -r requirements-build.txt pytest==9.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
          .\venv310\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Validate application contracts
        run: |
          .\venv310\Scripts\python.exe scripts\check_version_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          .\venv310\Scripts\python.exe -c "from evaluation.policy_dataset_v0.frozen_runtime import _verified_sources; print(len(_verified_sources()), 'frozen source digests verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen source digest validation failed' }
          .\venv310\Scripts\python.exe -m pytest -q tests/test_session_notes.py tests/test_data_backup.py tests/test_graceful_shutdown.py tests/test_storage_migrations.py tests/test_conversation_management.py tests/test_focus_tasks.py tests/test_execution_effects.py tests/test_path_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade-related backend tests failed' }
          npm test --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run lint --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed' }
          npm test --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          npm run check --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop syntax checks failed' }
      - name: Bind build to the exact commit
        id: identity
        run: |
          node scripts/prepare-commit-update.cjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Commit version preparation failed' }
          .\venv310\Scripts\python.exe scripts\check_version_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged version consistency failed' }
      - name: Build Windows backend and frontend
        run: .\scripts\build-desktop-backend.ps1 -Python .\venv310\Scripts\python.exe
      - name: Smoke test frozen backend
        env:
          TEXA_FROZEN_SMOKE: '1'
          TEXA_EMBEDDING_BACKEND: onnx
          TEXA_EMBEDDING_ASSET_DIR: ${{ github.workspace }}/assets/embedding-runtime/bge-small-zh-v1.5/onnx-fp32-v1
          DATA_DIR: ${{ runner.temp }}/texa-commit-smoke/data
          PROGRESS_PATH: ${{ runner.temp }}/texa-commit-smoke/progress
        run: |
          $process = Start-Process build\backend\backend_server\backend_server.exe -NoNewWindow -PassThru -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-error.log
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Frozen backend smoke timed out' }
          Get-Content smoke-out.log
          Get-Content smoke-error.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path smoke-out.log -SimpleMatch TEXA_FROZEN_SMOKE_PASS)) { throw 'Frozen backend smoke failed' }
      - name: Package unsigned Windows update
        working-directory: desktop
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Bind and verify update manifest
        run: |
          node scripts/prepare-commit-update.cjs annotate
          if ($LASTEXITCODE -ne 0) { throw 'Update annotation failed' }
          $version = (Get-Content desktop\package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-commit-release.cjs release $env:GITHUB_SHA $version windows
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest validation failed' }
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-baseline
          path: ${{ runner.temp }}/texa-baseline
      - name: Exercise real updater download and NSIS upgrade
        run: |
          $env:TEXA_UPGRADE_BASELINE = "$env:RUNNER_TEMP/texa-baseline/texa_test_v0.9.1.exe"
          $env:TEXA_UPGRADE_ROOT = "$env:RUNNER_TEMP/texa-upgrade-validation"
          & .\desktop\node_modules\.bin\electron.cmd scripts\verify-windows-commit-upgrade.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows updater/installer validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: commit-update-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/commit.yml
            release/commit-build.json
            release/upgrade-verification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-update-diagnostics
          path: |
            smoke-out.log
            smoke-error.log
            release/upgrade-verification.json
            release/upload-receipt.json
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: commit-update-windows
          path: update
      - name: Verify manifest and downloaded package hashes
        env:
          UPDATE_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/verify-commit-release.cjs update "$GITHUB_SHA" "$UPDATE_VERSION" windows
      - name: Publish verified unsigned Windows commit update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${UPDATE_VERSION}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "Texa Windows 修复 ${GITHUB_SHA:0:8}" --notes "Unsigned Windows x64 NSIS update. Branch: Texa_MacOS. Source commit: $GITHUB_SHA. Application tests, frozen backend smoke and actual updater download/NSIS upgrade checks passed. macOS source updates remain available; this release contains no macOS automatic update package."
          gh release upload "$tag" update/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json tagName,isDraft,isPrerelease,url,assets,targetCommitish > upload-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: commit-update-upload-receipt
          path: upload-receipt.json
