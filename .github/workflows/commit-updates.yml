name: Texa commit updates

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified Windows and macOS installers
        type: boolean
        default: false
  push:
    branches: [Texa_MacOS]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: texa-commit-updates
  cancel-in-progress: true

jobs:
  baseline:
    if: github.ref == 'refs/heads/Texa_MacOS'
    runs-on: ubuntu-latest
    permissions:
      # GitHub draft releases require push permission even for downloads.
      contents: write
    steps:
      - name: Fetch pinned inspection installer from the existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release download v0.9.1 --pattern texa_test_v0.9.1.exe --dir baseline
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-baseline
          path: baseline/texa_test_v0.9.1.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build:
    needs: baseline
    if: github.ref == 'refs/heads/Texa_MacOS'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    outputs:
      version: ${{ steps.identity.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact commit bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-release.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install locked CI dependencies
        run: |
          python -m venv venv310
          .\venv310\Scripts\python.exe -m pip install -r requirements-build.txt pytest==9.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
          .\venv310\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
          npm ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency installation failed' }
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency installation failed' }
      - name: Validate application contracts
        run: |
          .\venv310\Scripts\python.exe scripts\check_version_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          .\venv310\Scripts\python.exe -c "from evaluation.policy_dataset_v0.frozen_runtime import _verified_sources; print(len(_verified_sources()), 'frozen source digests verified')"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen source digest validation failed' }
          .\venv310\Scripts\python.exe -m pytest -q tests/test_session_notes.py tests/test_data_backup.py tests/test_graceful_shutdown.py tests/test_storage_migrations.py tests/test_conversation_management.py tests/test_focus_tasks.py tests/test_execution_effects.py tests/test_path_safety.py tests/test_outline_recovery.py tests/test_outline_upgrade.py tests/test_mineru_structured_content.py tests/test_textbook_workflow_repairs.py tests/test_document_ir.py
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade-related backend tests failed' }
          npm test --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend tests failed' }
          npm run lint --prefix frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend lint failed' }
          npm test --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          npm run check --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop syntax checks failed' }
          node scripts/verify-electron-update-restart.cjs update-restart-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Native Electron update exit/relaunch checks failed' }
          node scripts/verify-nsis-staged-update.cjs nsis-staged-update-verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Native NSIS staged replacement/failure recovery checks failed' }
      - name: Bind build to the exact commit
        id: identity
        run: |
          node scripts/prepare-commit-update.cjs prepare
          if ($LASTEXITCODE -ne 0) { throw 'Commit version preparation failed' }
          .\venv310\Scripts\python.exe scripts\check_version_consistency.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged version consistency failed' }
      - name: Build Windows backend and frontend
        run: .\scripts\build-desktop-backend.ps1 -Python .\venv310\Scripts\python.exe
      - name: Smoke test frozen backend
        env:
          TEXA_FROZEN_SMOKE: '1'
          TEXA_EMBEDDING_BACKEND: onnx
          TEXA_EMBEDDING_ASSET_DIR: ${{ github.workspace }}/assets/embedding-runtime/bge-small-zh-v1.5/onnx-fp32-v1
          DATA_DIR: ${{ runner.temp }}/texa-commit-smoke/data
          PROGRESS_PATH: ${{ runner.temp }}/texa-commit-smoke/progress
        run: |
          $process = Start-Process build\backend\backend_server\backend_server.exe -NoNewWindow -PassThru -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-error.log
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Frozen backend smoke timed out' }
          Get-Content smoke-out.log
          Get-Content smoke-error.log
          if ($process.ExitCode -ne 0 -or -not (Select-String -Path smoke-out.log -SimpleMatch TEXA_FROZEN_SMOKE_PASS)) { throw 'Frozen backend smoke failed' }
      - name: Package unsigned Windows update
        working-directory: desktop
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Bind and verify update manifest
        run: |
          node scripts/prepare-commit-update.cjs annotate
          if ($LASTEXITCODE -ne 0) { throw 'Update annotation failed' }
          $version = (Get-Content desktop\package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-commit-release.cjs release $env:GITHUB_SHA $version windows
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest validation failed' }
          node scripts/verify-nsis-payload-size.cjs "release/Texa-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'NSIS payload duplication check failed' }
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-baseline
          path: ${{ runner.temp }}/texa-baseline
      - name: Exercise real updater download and NSIS upgrade
        run: |
          $env:TEXA_UPGRADE_BASELINE = "$env:RUNNER_TEMP/texa-baseline/texa_test_v0.9.1.exe"
          $env:TEXA_UPGRADE_ROOT = "$env:RUNNER_TEMP/texa-upgrade-validation"
          & .\desktop\node_modules\.bin\electron.cmd scripts\verify-windows-commit-upgrade.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows updater/installer validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: commit-update-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/commit.yml
            release/commit-build.json
            release/upgrade-verification.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-update-diagnostics
          path: |
            smoke-out.log
            smoke-error.log
            update-restart-verification.json
            nsis-staged-update-verification.json
            release/upgrade-verification.json
            release/upload-receipt.json
          if-no-files-found: ignore

  build-macos:
    if: github.ref == 'refs/heads/Texa_MacOS'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-release.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install locked macOS build dependencies
        run: |
          set -euo pipefail
          python -m venv venv310
          venv310/bin/python -m pip install -r requirements-build.txt
          venv310/bin/python -m pip check
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Bind macOS build to the same commit
        run: |
          node scripts/prepare-commit-update.cjs prepare
          venv310/bin/python scripts/check_version_consistency.py
      - name: Build native Apple Silicon backend and frontend
        run: bash scripts/build-desktop-backend-macos.sh
      - name: Package unsigned macOS DMG and update ZIP
        working-directory: desktop
        run: npx --no-install electron-builder --mac dmg zip --arm64 --publish never
      - name: Verify macOS artifacts and packaged backend
        run: |
          set -euo pipefail
          node scripts/prepare-commit-update.cjs annotate
          version=$(node -p "require('./desktop/package.json').version")
          node scripts/verify-commit-release.cjs release "$GITHUB_SHA" "$version" mac
          app="release/mac-arm64/Texa.app"
          file "$app/Contents/MacOS/Texa" | tee macos-binary.log
          grep -q arm64 macos-binary.log
          export TEXA_FROZEN_SMOKE=1 TEXA_EMBEDDING_BACKEND=onnx
          export TEXA_EMBEDDING_ASSET_DIR="$GITHUB_WORKSPACE/$app/Contents/Resources/embedding-runtime/bge-small-zh-v1.5/onnx-fp32-v1"
          export DATA_DIR="$RUNNER_TEMP/texa-macos-smoke/data" PROGRESS_PATH="$RUNNER_TEMP/texa-macos-smoke/progress"
          "$app/Contents/Resources/backend/backend_server/backend_server" > macos-smoke.log 2>&1
          cat macos-smoke.log
          grep -q TEXA_FROZEN_SMOKE_PASS macos-smoke.log
          dmg="release/Texa-$version-mac-arm64.dmg"
          hdiutil verify "$dmg" > macos-dmg.log
          mount=$(mktemp -d "$RUNNER_TEMP/texa-dmg.XXXXXX")
          trap 'hdiutil detach "$mount" || true' EXIT
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly >> macos-dmg.log
          test -x "$mount/Texa.app/Contents/MacOS/Texa"
          test -x "$mount/Texa.app/Contents/Resources/backend/backend_server/backend_server"
          hdiutil detach "$mount"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: commit-update-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/commit-mac.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commit-update-macos-diagnostics
          path: |
            macos-smoke.log
            macos-dmg.log
            macos-binary.log
          if-no-files-found: ignore

  publish:
    needs: [build, build-macos]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: commit-update-windows
          path: update
      - uses: actions/download-artifact@v4
        with:
          name: commit-update-macos
          path: update
      - name: Verify both platform manifests and downloaded packages
        env:
          UPDATE_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/verify-commit-release.cjs update "$GITHUB_SHA" "$UPDATE_VERSION" both
      - name: Publish verified Windows and macOS installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UPDATE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${UPDATE_VERSION}"
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "Texa 桌面安装版 ${GITHUB_SHA:0:8}" --notes "Windows x64 NSIS installer and macOS Apple Silicon DMG/ZIP. Branch: Texa_MacOS. Source commit: $GITHUB_SHA. Windows application tests, frozen backend smoke and updater/NSIS upgrade checks passed. macOS native backend smoke, platform manifests and DMG verification passed. Unsigned installers; macOS artifacts are not notarized."
          gh release upload "$tag" update/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json tagName,isDraft,isPrerelease,url,assets,targetCommitish > upload-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: commit-update-upload-receipt
          path: upload-receipt.json
